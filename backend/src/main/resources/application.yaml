spring:
  application:
    name: Main

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW-SQL:false}
    properties:
      hibernate:
        format-sql: true

  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE:false}

app:
  cookie-secure: ${COOKIE_SECURE:false}
  cors-origin: ${CORS_ORIGIN:http://localhost:8000}
